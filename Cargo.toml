[package]
name = "mtest"
# Date code v.YYYYMMDD; Cargo needs three numbers, so it is YYYYMMDD.0.0.
version = "20261109.0.0"
edition = "2021"

[[bin]]
name = "mtest"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Foundation"] }

# Linux needs a windowing backend: both Wayland and X11.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
