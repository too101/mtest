# Builds MTEST for Windows and Linux (32/64-bit), and macOS (Intel and Apple Silicon).
# The programs appear under the run's "Artifacts"; a tag like v.20261109 also attaches them to a release.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: mtest.exe
            name: mtest-windows-x86_64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            file: mtest.exe
            name: mtest-windows-x86.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            file: mtest
            name: mtest-linux-x86_64
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            file: mtest
            name: mtest-linux-x86
          - os: macos-latest
            target: aarch64-apple-darwin
            file: mtest
            name: mtest-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: mtest
            name: mtest-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux libraries
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Linux 32-bit libraries
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib pkg-config libxkbcommon-dev:i386 libgl1-mesa-dev:i386 libwayland-dev:i386 libx11-dev:i386 libxcursor-dev:i386 libxrandr-dev:i386 libxi-dev:i386
      - name: Configure Linux 32-bit build
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name the program
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.file }} out/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.name }}
