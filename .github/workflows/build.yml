# Builds MTEST for Windows, Linux and macOS (Intel and Apple Silicon) on every push and tag.
# The programs appear under the run's "Artifacts"; a tag like v1.2.0 also attaches them to a release.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: mtest.exe
            name: mtest-windows-x86_64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            file: mtest
            name: mtest-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            file: mtest
            name: mtest-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            file: mtest
            name: mtest-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name the program
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.file }} out/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.name }}
